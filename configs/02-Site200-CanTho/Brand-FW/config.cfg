!
hostname Brand-FW-S200
!
interface GigabitEthernet0/0
 no shutdown
!
interface GigabitEthernet0/0.60
 vlan 60
 nameif vlan60
 security-level 100
 ip address 10.2.60.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.70
 vlan 70
 nameif vlan70
 security-level 100
 ip address 10.2.70.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0.99
 vlan 99
 nameif vlan99
 security-level 100
 ip address 10.2.99.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 nameif outside1
 security-level 0
 ip address 10.2.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 nameif outside2
 security-level 0
 ip address 10.2.1.5 255.255.255.252
 no shutdown
!
route outside1 0.0.0.0 0.0.0.0 10.2.1.2 1
route outside2 0.0.0.0 0.0.0.0 10.2.1.6 2
!
dhcpd address 10.2.60.100-10.2.60.199 vlan60
dhcpd enable vlan60
dhcpd address 10.2.70.100-10.2.70.199 vlan70
dhcpd enable vlan70
!
