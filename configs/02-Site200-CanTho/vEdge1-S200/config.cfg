system
 host-name vEdge1-S200
 system-ip 10.200.200.1
 site-id 200
 organization-name site-900
 vbond 10.9.0.12
 admin-tech-on-failure

!
vpn 0
 interface ge0/2
  ip address 100.64.200.1/30
  tunnel-interface
  encapsulation ipsec
  color mpls
  no allow-service bgp
  allow-service dhcp
  allow-service dns
  allow-service icmp
  no allow-service sshd
  no allow-service netconf
  no allow-service ntp
  no allow-service stun
  allow-service all
  no shutdown
 !
 router bgp 65010
  neighbor 100.64.200.2 remote-as 64512
  address-family ipv4-unicast
  !
 !
!
vpn 512
 interface ge0/0
  ip address 10.2.1.2/30
  no shutdown
 !
 interface ge0/3
  ip address 10.2.2.1/30
  no shutdown
 !
 ip route 0.0.0.0/0 10.2.1.1
!
omp
 no shutdown
!
commit