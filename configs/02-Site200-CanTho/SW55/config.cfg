!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SW55
!
vlan 60
 name NONG-NGHIEP
!
vlan 99
 name MANAGEMENT
!
boot-start-marker
boot-end-marker
!
!
!
! username netops privilege 15 secret <xem file credentials cuc bo - dong 'netops (SSH Site 100)'>
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
!
!
!
ip domain-name campus.internal
ip cef
no ipv6 cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description To SwitchBrand-S200 e0/0
 switchport trunk allowed vlan 60,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 description To VPC43 (PC NN-1 - 10.2.60.10)
 switchport access vlan 60
 switchport mode access
!
interface Ethernet0/2
 description To VPC44 (PC NN-2 - 10.2.60.11)
 switchport access vlan 60
 switchport mode access
!
interface Ethernet0/3
!
interface Vlan99
 ip address 10.2.99.11 255.255.255.0
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.2.99.1
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list standard NETOPS_MGMT
 permit 10.1.99.50
 permit 10.1.90.10
 deny   any log
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class NETOPS_MGMT in
 login local
 transport input ssh
!
!
!
end
