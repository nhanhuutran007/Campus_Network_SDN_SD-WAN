system
 host-name vEdge2-S400
 system-ip 10.200.40.2
 site-id 400
 organization-name site-900
 vbond 10.9.0.12
 admin-tech-on-failure
!
bfd
 app-route
  poll-interval 120000
 !
!
vpn 0
interface ge0/0
   ip address 203.0.113.17/30
   tunnel-interface
   encapsulation ipsec
   color biz-internet
  no allow-service bgp
  allow-service dhcp
  allow-service dns
  allow-service icmp
  no allow-service sshd
  no allow-service netconf
  no allow-service ntp
  no allow-service stun
  allow-service all
  no shutdown
 !
 router bgp 65030
  neighbor 203.0.113.18 remote-as 64511
  address-family ipv4-unicast
  !
 !
!
vpn 1
 name LAN
 interface ge0/1
  ip address 10.4.2.2/30
  no shutdown
 !
 interface ge0/2
  ip address 10.4.1.6/30
  no shutdown
 !
 ip route 10.4.0.0/16 10.4.2.1
!
vpn 512
 interface eth0
  ip dhcp-client
  ipv6 dhcp-client
  no shutdown
 !
!
omp
 no shutdown
!
