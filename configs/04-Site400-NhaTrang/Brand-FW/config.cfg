!
hostname Brand-FW-S400
!
interface GigabitEthernet0/0
 nameif outside1
 security-level 0
 ip address 10.4.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif outside2
 security-level 0
 ip address 10.4.1.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 no shutdown
!
interface GigabitEthernet0/2.50
 vlan 50
 nameif vlan50
 security-level 100
 ip address 10.4.50.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2.60
 vlan 60
 nameif vlan60
 security-level 100
 ip address 10.4.60.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2.99
 vlan 99
 nameif vlan99
 security-level 100
 ip address 10.4.99.1 255.255.255.0
 no shutdown
!
route outside1 0.0.0.0 0.0.0.0 10.4.1.2 1
route outside2 0.0.0.0 0.0.0.0 10.4.1.6 2
!
dhcpd address 10.4.50.100-10.4.50.199 vlan50
dhcpd enable vlan50
dhcpd address 10.4.60.100-10.4.60.199 vlan60
dhcpd enable vlan60
!
