!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SwitchBrand-S400
!
vlan 50
 name THUY-SAN
!
vlan 60
 name LU-HANH
!
vlan 99
 name MANAGEMENT
!
boot-start-marker
boot-end-marker
!
!
!
! username netops privilege 15 secret <xem file credentials cuc bo - dong 'netops (SSH Site 100)'>
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
no ipv6 cef
!
!
!
!
!
ip domain-name campus.internal
!
!
ip cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description To Brand-FW Gi0/2 (trunk 50,60,99)
 switchport trunk allowed vlan 50,60,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 description To SW60 e0/0
 switchport trunk allowed vlan 50,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/2
 description To SW57 e0/0
 switchport trunk allowed vlan 60,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/3
!
interface Vlan99
 ip address 10.4.99.2 255.255.255.0
!
ip forward-protocol nd
!
no ip http server
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip route 0.0.0.0 0.0.0.0 10.4.99.1
!
!
ip access-list standard NETOPS_MGMT
 permit 10.1.99.50
 permit 10.1.90.10
 deny   any log
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class NETOPS_MGMT in
 login local
 transport input ssh
!
!
!
end
