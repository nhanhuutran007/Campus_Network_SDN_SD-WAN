system
 host-name vBond
 system-ip 10.9.0.12
 site-id 900
 organization-name "site-900"
 vbond 10.9.0.12 local
!
vpn 0
 interface ge0/0
  description To Switch32 (Controller-LAN)
  ip address 10.9.0.12/24
  tunnel-interface
   allow-service netconf
   allow-service dhcp
   allow-service dns
   allow-service icmp
  no shutdown
 !
 interface eth0
  description To Switch61 (Cloud-Mgmt / NAT 1:1 -> 203.0.113.100)
  ip address 10.9.1.12/24
  tunnel-interface
   allow-service netconf
   allow-service dhcp
   allow-service dns
   allow-service icmp
  no shutdown
 !
 ip route 0.0.0.0/0 10.9.0.2
 ip route 0.0.0.0/0 10.9.1.1