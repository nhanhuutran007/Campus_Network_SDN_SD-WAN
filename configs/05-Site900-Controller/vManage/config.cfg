system
 host-name vManager
 system-ip 10.9.0.10
 site-id 900
 organization-name "your-org-name"
 vbond 10.9.0.12
!
vpn 0
 interface eth0
  description To Switch32 (Controller-LAN)
  ip address 10.9.0.10/24
  tunnel-interface
  no shutdown
 !
 interface eth1
  description To Switch61 (Cloud-Mgmt)
  ip address 10.9.1.10/24
  tunnel-interface
  no shutdown
 !
 ip route 0.0.0.0/0 10.9.0.2