 system
 host-name             vsmart
 system-ip             10.9.0.13
 site-id               900
 admin-tech-on-failure
 no vrrp-advt-with-phymac
 organization-name     site-900
 vbond 10.9.0.12
 aaa
  auth-order      local radius tacacs
  usergroup basic
   task system read
   task interface read
  !
  usergroup netadmin
  !
  usergroup operator
   task system read
   task interface read
   task policy read
   task routing read
   task security read
  !
  usergroup tenantadmin
  !
  user admin
   password $6$10f53575ee1d1611$/EwQZvVF0ZpXVopwvvn7sd3FMnS4jRXsf3eYzNZABFT7urBG5/MRh0oa6Zu9FJbeUuSuCR6XBZD3ldRPdFrgV/
  !
  ciscotacro-user true
  ciscotacrw-user true
 !
 logging
  disk
   enable
  !
 !
 ntp
  parent
   no enable
   stratum 5
  exit
 !
!
omp
 no shutdown
 filter-route
  no outbound affinity-group-preference
 exit
 graceful-restart
 outbound-policy-caching
!
vpn 0
 interface eth0
  ip address 10.9.0.11/24
  tunnel-interface
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   no allow-service ntp
   no allow-service stun
  !
  no shutdown
 !
 interface eth1
  ip address 10.9.1.11/24
  no shutdown
 !
 ip route 0.0.0.0/0 10.9.0.2
!
vpn 512
!
policy
 sla-class SLA_BUSINESS
  loss    5
  latency 300
  jitter  100
  fallback-best-tunnel
   criteria latency loss
  !
 !
 sla-class SLA_REALTIME
  loss    2
  latency 150
  jitter  50
  fallback-best-tunnel
   criteria latency loss
  !
 !
 data-policy DP_BRANCH
  vpn-list VPN_LAN
   sequence 10
    match
     destination-data-prefix-list SERVER_FARM
     destination-port             23
     protocol                     6
    !
    action drop
     count TELNET_TO_FARM
    !
   !
   sequence 15
    match
     destination-data-prefix-list DMZ
     destination-port             22 23
     protocol                     6
    !
    action drop
     count ADMIN_TO_DMZ
    !
   !
   sequence 20
    match
     protocol 1
    !
    action accept
     count ICMP_BRANCH
    !
   !
   default-action accept
  !
 !
 app-route-policy AAR_LAN
  vpn-list VPN_LAN
   sequence 10
    match
     protocol 1
    !
    action
     count AAR_ICMP
     sla-class SLA_REALTIME fallback-to-best-path
    !
   !
   sequence 20
    match
     dscp 46
    !
    action
     count AAR_VOICE
     sla-class SLA_REALTIME fallback-to-best-path
    !
   !
   sequence 30
    match
     destination-data-prefix-list SERVER_FARM
    !
    action
     count AAR_FARM
     sla-class SLA_BUSINESS fallback-to-best-path
    !
   !
   sequence 40
    match
     destination-data-prefix-list DMZ
     destination-port             443 80
    !
    action
     count AAR_WEB
     sla-class SLA_BUSINESS fallback-to-best-path
    !
   !
   sequence 41
    match
     source-data-prefix-list DMZ
     source-port             443 80
    !
    action
     count AAR_WEB_RET
     sla-class SLA_BUSINESS fallback-to-best-path
    !
   !
   sequence 50
    match
     destination-data-prefix-list DMZ
     destination-port             143 25 587 993
    !
    action
     count AAR_MAIL
     sla-class SLA_BUSINESS fallback-to-best-path
    !
   !
   sequence 51
    match
     source-data-prefix-list DMZ
     source-port             143 25 587 993
    !
    action
     count AAR_MAIL_RET
     sla-class SLA_BUSINESS fallback-to-best-path
    !
   !
  !
 !
 lists
  vpn-list VPN_LAN
   vpn 1
  !
  data-prefix-list DMZ
   ip-prefix 10.1.1.0/28
  !
  data-prefix-list SERVER_FARM
   ip-prefix 10.1.90.0/24
  !
  site-list ALL_EDGES
   site-id 100-400
  !
  site-list BRANCHES
   site-id 200-400
  !
 !
 control-policy PREFER-VE1
  sequence 10
   match route
    originator 10.200.100.1
   !
   action accept
    set
     preference 200
    !
   !
  !
  sequence 20
   match route
    originator 10.200.200.1
   !
   action accept
    set
     preference 200
    !
   !
  !
  sequence 30
   match route
    originator 10.200.30.1
   !
   action accept
    set
     preference 200
    !
   !
  !
  sequence 40
   match route
    originator 10.200.40.1
   !
   action accept
    set
     preference 200
    !
   !
  !
  default-action accept
 !
!
apply-policy
 site-list ALL_EDGES
  control-policy PREFER-VE1 out
  app-route-policy AAR_LAN
 !
 site-list BRANCHES
  data-policy DP_BRANCH from-service
 !
!
