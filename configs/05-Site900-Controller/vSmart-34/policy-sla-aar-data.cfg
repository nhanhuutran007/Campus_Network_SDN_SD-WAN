! SLA class + AAR + data policy cho vSmart 34 (CLI mode, vManaged: false)
! ĐÃ ÁP LIVE 23/09/2026 (validate + commit OK). Cách áp lại: vào `config` của vSmart,
! gõ từng khối (thoát submode bằng `exit`), `validate`, rồi `commit`. Kiểm tra bằng
!   vSmart: show running-config policy / show running-config apply-policy
!   vEdge : show policy from-vsmart / show app-route sla-class / show app-route stats
!           show policy data-policy-filter / show policy app-route-policy-filter
! Giữ nguyên control-policy PREFER-S100-VE1 đang chạy (chỉ thêm).
!
! Thiết kế:
!  - SLA_REALTIME: ICMP + DSCP 46 (voice), ưu tiên color mpls
!  - SLA_BUSINESS: lưu lượng tới Server Farm 10.1.90.0/24, ưu tiên biz-internet
!  - DP_BRANCH (from-service trên site 200-400): chặn Telnet (TCP 23) từ chi nhánh
!    vào Server Farm, đếm ICMP để minh hoạ; còn lại accept
!
policy
 sla-class SLA_REALTIME
  loss    2
  latency 150
  jitter  50
 !
 sla-class SLA_BUSINESS
  loss    5
  latency 300
  jitter  100
 !
 lists
  vpn-list VPN_LAN
   vpn 1
  !
  site-list ALL_EDGES
   site-id 100-400
  !
  data-prefix-list SERVER_FARM
   ip-prefix 10.1.90.0/24
  !
 !
 app-route-policy AAR_LAN
  vpn-list VPN_LAN
   sequence 10
    match
     protocol 1
    !
    action
     sla-class SLA_REALTIME preferred-color mpls
    !
   !
   sequence 20
    match
     dscp 46
    !
    action
     sla-class SLA_REALTIME preferred-color mpls
    !
   !
   sequence 30
    match
     destination-data-prefix-list SERVER_FARM
    !
    action
     sla-class SLA_BUSINESS preferred-color biz-internet
    !
   !
  !
 !
 data-policy DP_BRANCH
  vpn-list VPN_LAN
   sequence 10
    match
     destination-data-prefix-list SERVER_FARM
     protocol         6
     destination-port 23
    !
    action drop
     count TELNET_TO_FARM
    !
   !
   sequence 20
    match
     protocol 1
    !
    action accept
     count ICMP_BRANCH
    !
   !
   default-action accept
  !
 !
!
apply-policy
 site-list ALL_EDGES
  app-route-policy AAR_LAN
 !
 site-list BRANCHES
  data-policy DP_BRANCH from-service
 !
!
! Đã áp trên cả 8 vEdge (để AAR phản ứng nhanh; mặc định poll 10 phút):
!   bfd app-route poll-interval 120000
!
! ---- Bổ sung 23/09/2026 (đã áp live): dịch vụ DMZ 10.1.1.0/28 (Web 10.1.1.10, Mail 10.1.1.11) ----
! policy lists data-prefix-list DMZ ip-prefix 10.1.1.0/28
! app-route-policy AAR_LAN vpn-list VPN_LAN
!  sequence 40  match destination-data-prefix-list DMZ destination-port 80 443        -> sla-class SLA_BUSINESS preferred-color biz-internet
!  sequence 41  match source-data-prefix-list DMZ      source-port 80 443             -> sla-class SLA_BUSINESS preferred-color biz-internet
!  sequence 50  match destination-data-prefix-list DMZ destination-port 25 143 587 993 -> sla-class SLA_BUSINESS preferred-color mpls
!  sequence 51  match source-data-prefix-list DMZ      source-port 25 143 587 993     -> sla-class SLA_BUSINESS preferred-color mpls
! data-policy DP_BRANCH vpn-list VPN_LAN
!  sequence 15  match destination-data-prefix-list DMZ protocol 6 destination-port 22 23 -> action drop, count ADMIN_TO_DMZ
! Bản đầy đủ đang chạy: xem config.cfg cùng thư mục.
