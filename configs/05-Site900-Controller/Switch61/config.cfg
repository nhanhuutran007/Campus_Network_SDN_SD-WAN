!
hostname Switch61
!
vtp mode off
!
vlan 10
 name CLOUD-MGMT
!
interface Ethernet0/0
 description To Cloud "Net" (pnet0) - DHCP client (real LAN)
 no switchport
 ip address dhcp
 no shutdown
!
interface Ethernet0/1
 description To vManager eth1 (10.9.1.10)
 switchport access vlan 10
 switchport mode access
 no shutdown
!
interface Ethernet0/2
 description To vSmart eth1 (10.9.1.11)
 switchport access vlan 10
 switchport mode access
 no shutdown
!
interface Ethernet0/3
 description To vBond eth0 (10.9.1.12 - NAT 1:1 -> 203.0.113.100)
 switchport access vlan 10
 switchport mode access
 no shutdown
!
interface Vlan10
 description CLOUD-MGMT 10.9.1.0/24 - Gateway
 ip address 10.9.1.1 255.255.255.0
 no shutdown
!
ip routing
!
end