!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname Switch61
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
vtp mode off
!
!
!
ip cef
no ipv6 cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
vlan 10
 name CLOUD-MGMT
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description To Cloud "Net" (pnet0) - DHCP client (real LAN)
 no switchport
 ip address dhcp
!
interface Ethernet0/1
 description To vManager eth1 (10.9.1.10)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet0/2
 description To vSmart eth1 (10.9.1.11)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet0/3
 description To vBond eth0 (10.9.1.12 - NAT 1:1 -> 203.0.113.100)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet1/0
!
interface Ethernet1/1
!
interface Ethernet1/2
!
interface Ethernet1/3
!
interface Ethernet2/0
!
interface Ethernet2/1
!
interface Ethernet2/2
!
interface Ethernet2/3
!
interface Vlan10
 description CLOUD-MGMT 10.9.1.0/24 - Gateway
 ip address 10.9.1.1 255.255.255.0
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
!
!
!
end
