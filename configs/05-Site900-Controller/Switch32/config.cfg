!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname Switch32
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
vtp mode off
!
!
!
ip cef
no ipv6 cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
vlan 10
 name CONTROLLER-LAN
!
vlan 250
 name WAN-INTERNET
!
vlan 251
 name WAN-MPLS
!
vlan 252
 name WAN-VEDGE65
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description To vBond ge0/0 (10.9.0.12)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet0/1
 description To vSmart eth0 (10.9.0.11)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet0/2
 description To vManager eth0 (10.9.0.10)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet0/3
 description To Win (10.9.0.20)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet1/0
 description To Internet Gi0/2 (203.0.113.248/30)
 switchport access vlan 250
 switchport mode access
!
interface Ethernet1/1
 description To MPLS Gi0/1 (100.64.255.248/30)
 switchport access vlan 251
 switchport mode access
!
interface Ethernet1/2
 description To vEdge65 ge0/0 (203.0.113.244/30)
 switchport access vlan 252
 switchport mode access
!
interface Ethernet1/3
 description To vEdge65 ge0/1 (10.9.0.100)
 switchport access vlan 10
 switchport mode access
!
interface Ethernet2/0
!
interface Ethernet2/1
!
interface Ethernet2/2
!
interface Ethernet2/3
!
interface Ethernet3/0
!
interface Ethernet3/1
!
interface Ethernet3/2
!
interface Ethernet3/3
!
interface Ethernet4/0
!
interface Ethernet4/1
!
interface Ethernet4/2
!
interface Ethernet4/3
!
interface Ethernet5/0
!
interface Ethernet5/1
!
interface Ethernet5/2
!
interface Ethernet5/3
!
interface Ethernet6/0
!
interface Ethernet6/1
!
interface Ethernet6/2
!
interface Ethernet6/3
!
interface Ethernet7/0
!
interface Ethernet7/1
!
interface Ethernet7/2
!
interface Ethernet7/3
!
interface Vlan10
 description CONTROLLER-LAN 10.9.0.0/24 - Gateway
 ip address 10.9.0.2 255.255.255.0
!
interface Vlan250
 description WAN Internet 203.0.113.248/30
 ip address 203.0.113.249 255.255.255.252
!
interface Vlan251
 description WAN MPLS 100.64.255.248/30
 ip address 100.64.255.249 255.255.255.252
!
interface Vlan252
 description WAN vEdge65 203.0.113.244/30
 ip address 203.0.113.246 255.255.255.252
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 203.0.113.250
ip route 100.64.0.0 255.255.0.0 100.64.255.250
ip route 203.0.113.0 255.255.255.0 203.0.113.250
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
!
!
!
end
