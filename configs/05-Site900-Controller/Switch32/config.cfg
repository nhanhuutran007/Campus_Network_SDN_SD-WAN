!
hostname Switch32
!
vlan 10
 name CONTROLLER-LAN
!
vlan 250
 name WAN-INTERNET
!
vlan 251
 name WAN-MPLS
!
vlan 252
 name WAN-VEDGE65
!
interface GigabitEthernet0/0
 description To vBond ge0/0 (10.9.0.12)
 switchport access vlan 10
 switchport mode access
!
interface GigabitEthernet0/1
 description To vSmart eth0 (10.9.0.11)
 switchport access vlan 10
 switchport mode access
!
interface GigabitEthernet0/2
 description To vManager eth0 (10.9.0.10)
 switchport access vlan 10
 switchport mode access
!
interface GigabitEthernet0/3
 description To Win (10.9.0.20)
 switchport access vlan 10
 switchport mode access
!
interface GigabitEthernet1/0
 description To Internet Gi0/2 (203.0.113.248/30)
 switchport access vlan 250
 switchport mode access
!
interface GigabitEthernet1/1
 description To MPLS Gi0/1 (100.64.255.248/30)
 switchport access vlan 251
 switchport mode access
!
interface GigabitEthernet1/2
 description To vEdge65 ge0/0 (203.0.113.244/30)
 switchport access vlan 252
 switchport mode access
!
interface GigabitEthernet1/3
 description To vEdge65 ge0/1 (10.9.0.100)
 switchport access vlan 10
 switchport mode access
!
interface Vlan10
 description CONTROLLER-LAN 10.9.0.0/24 - Gateway
 ip address 10.9.0.2 255.255.255.0
!
interface Vlan250
 description WAN Internet 203.0.113.248/30
 ip address 203.0.113.249 255.255.255.252
!
interface Vlan251
 description WAN MPLS 100.64.255.248/30
 ip address 100.64.255.249 255.255.255.252
!
interface Vlan252
 description WAN vEdge65 203.0.113.244/30
 ip address 203.0.113.246 255.255.255.252
!
ip route 0.0.0.0 0.0.0.0 203.0.113.250
!
end
