!

omp

 no shutdown

 filter-route

  no outbound affinity-group-preference

 exit

 graceful-restart

 outbound-policy-caching

!

vpn 0

 interface eth0

  ip address 10.9.0.11/24

  no shutdown

 !

 interface eth0/0

  tunnel-interface

   allow-service dhcp

   allow-service dns

   allow-service icmp

   allow-service sshd

   allow-service netconf

   no allow-service ntp

   no allow-service stun

  !

  shutdown

 !

 interface eth1

  ip address 10.9.1.11/24

  no shutdown

 !

 ip route 0.0.0.0/0 10.9.0.2

!

vpn 512

!

policy

 sla-class SLA_BUSINESS

  loss    5

  latency 300

  jitter  100

 !

 sla-class SLA_REALTIME

  loss    2

  latency 150

  jitter  50

 !

 data-policy DP_BRANCH

  vpn-list VPN_LAN

   sequence 10

    match

     destination-data-prefix-list SERVER_FARM

     destination-port             23

     protocol                     6

    !

    action drop

     count TELNET_TO_FARM

    !

   !

   sequence 20

    match

     protocol 1

    !

    action accept

     count ICMP_BRANCH

    !

   !

   default-action accept

  !

 !

 app-route-policy AAR_LAN

  vpn-list VPN_LAN

   sequence 10

    match

     protocol 1

    !

    action

     sla-class SLA_REALTIME preferred-color mpls

    !

   !

   sequence 20

    match

     dscp 46

    !

    action

     sla-class SLA_REALTIME preferred-color mpls

    !

   !

   sequence 30

    match

     destination-data-prefix-list SERVER_FARM

    !

    action

     sla-class SLA_BUSINESS preferred-color biz-internet

    !

   !

  !

 !

 lists

  vpn-list VPN_LAN

   vpn 1

  !

  data-prefix-list SERVER_FARM

   ip-prefix 10.1.90.0/24

  !

  site-list ALL_EDGES

   site-id 100-400

  !

  site-list BRANCHES

   site-id 200-400

  !

 !

 control-policy PREFER-S100-VE1

  sequence 10

   match route

    originator 10.200.100.1

   !

   action accept

    set

     preference 200

    !

   !

  !

  default-action accept

 !

!
apply-policy

 site-list ALL_EDGES

  app-route-policy AAR_LAN

 !

 site-list BRANCHES

  control-policy PREFER-S100-VE1 out

  data-policy DP_BRANCH from-service

 !

!
