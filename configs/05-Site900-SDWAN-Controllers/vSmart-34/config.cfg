system

 host-name             vsmart

 system-ip             10.9.0.13

 site-id               900

 admin-tech-on-failure

 no vrrp-advt-with-phymac

 organization-name     site-900

 vbond 10.9.0.12

 aaa

  auth-order      local radius tacacs

  usergroup basic

   task system read

   task interface read

  !

  usergroup netadmin

  !

  usergroup operator

   task system read

   task interface read

   task policy read

   task routing read

   task security read

  !

--More--  usergroup tenantadmin

  !

  user admin

   password $6$10f53575ee1d1611$/EwQZvVF0ZpXVopwvvn7sd3FMnS4jRXsf3eYzNZABFT7urBG5/MRh0oa6Zu9FJbeUuSuCR6XBZD3ldRPdFrgV/

  !

  ciscotacro-user true

