system
 host-name             vmanage
 system-ip             10.9.3.10
 site-id               900
 admin-tech-on-failure
 no vrrp-advt-with-phymac
 sp-organization-name  site-900
 organization-name     site-900
 vbond 10.9.0.12
 aaa
  auth-order      local radius tacacs
  usergroup basic
   task system read
   task interface read
  !
  usergroup global
  !
  usergroup netadmin
  !
  usergroup network_operations
   task policy read write
  !
  usergroup operator
   task system read
   task interface read
   task policy read
   task routing read
   task security read
  !
  usergroup resource_group_admin
   task system read
   task interface read
  !
  usergroup resource_group_basic
   task system read
   task interface read
  !
  usergroup resource_group_operator
   task system read
   task interface read
  !
  usergroup security_operations
   task security read write
  !
  usergroup tenantadmin
  !
  user admin
   ! password <hash SHA-512 luu cuc bo - KHONG commit>
  !
  ciscotacro-user true
  ciscotacrw-user true
 !
 logging
  disk
   enable
  !
 !
 ssh-server
  cipher aes-128-192
  kex-algo sha1
 !
 ntp
  parent
   no enable
   stratum 5
  exit
 !
!
vpn 0
 interface eth0
  ip address 10.9.0.10/24
  tunnel-interface
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service stun
   allow-service https
  !
  no shutdown
 !
 interface eth1
  ip address 10.9.1.10/24
  no shutdown
 !
 ip route 0.0.0.0/0 10.9.0.2
!
vpn 512
!
