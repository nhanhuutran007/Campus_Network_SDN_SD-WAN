!config.cfg
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname MPLS
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
interface GigabitEthernet0/0
 description To Internet Gi0/1 (100.64.254.0/30)
 ip address 100.64.254.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description To Switch32 Gi1/1 (100.64.255.248/30)
 ip address 100.64.255.250 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description To vEdge2-S100 ge0/3 (100.64.100.4/30)
 ip address 100.64.100.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description To vEdge1-S100 ge0/2 (100.64.100.0/30)
 ip address 100.64.100.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description To vEdge1-S200 ge0/2 (100.64.200.0/30)
 ip address 100.64.200.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/5
 description To vEdge1-S300 ge0/0 (100.64.300.0/30)
 ip address 100.64.300.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/6
 description To vEdge1-S400 ge0/0 (100.64.400.0/30)
 ip address 100.64.400.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 100.64.254.2
 network 100.64.254.0 0.0.0.3 area 0
 network 100.64.255.248 0.0.0.3 area 0
 network 100.64.100.4 0.0.0.3 area 0
 network 100.64.100.0 0.0.0.3 area 0
 network 100.64.200.0 0.0.0.3 area 0
 network 100.64.300.0 0.0.0.3 area 0
 network 100.64.400.0 0.0.0.3 area 0
!
line con 0
 logging synchronous
!
end
