!config.cfg
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Internet
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
interface GigabitEthernet0/0
 description Cloud "Net" - Public segment 203.0.113.0/24
 ip address 203.0.113.254 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description To MPLS Gi0/0 (100.64.254.0/30)
 ip address 100.64.254.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description To Switch32 Gi1/0 (203.0.113.248/30)
 ip address 203.0.113.250 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description To vEdge2-S100 ge0/2 (203.0.113.4/30)
 ip address 203.0.113.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description To vEdge1-S100 ge0/3 (203.0.113.0/30)
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/5
 description To vEdge2-S200 ge0/0 (203.0.113.8/30)
 ip address 203.0.113.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/6
 description To vEdge2-S300 ge0/0 (203.0.113.12/30)
 ip address 203.0.113.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/7
 description To vEdge2-S400 ge0/0 (203.0.113.16/30)
 ip address 203.0.113.18 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 203.0.113.254
 network 100.64.254.0 0.0.0.3 area 0
 network 203.0.113.248 0.0.0.3 area 0
 network 203.0.113.0 0.0.0.3 area 0
 network 203.0.113.4 0.0.0.3 area 0
 network 203.0.113.8 0.0.0.3 area 0
 network 203.0.113.12 0.0.0.3 area 0
 network 203.0.113.16 0.0.0.3 area 0
!
line con 0
 logging synchronous
!
end
