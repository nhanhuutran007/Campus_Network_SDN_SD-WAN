system
 host-name vEdge-S500
 system-ip 10.200.50.1
 site-id 500
 organization-name site-900
 vbond 10.9.0.12
 admin-tech-on-failure
!
bfd app-route poll-interval 120000
!
vpn 0
 interface ge0/0
  ip address 203.0.113.21/30
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service stun
   allow-service all
  exit
  no shutdown
 exit
 interface ge0/1
  ip address 100.64.50.1/30
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service stun
   allow-service all
  exit
  no shutdown
 exit
 ip route 0.0.0.0/0 203.0.113.22
 ip route 0.0.0.0/0 100.64.50.2
 router bgp 65040
  neighbor 203.0.113.22 remote-as 64511
  neighbor 100.64.50.2 remote-as 64512
  address-family ipv4-unicast
  exit
 exit
exit
vpn 1
 name LAN
 interface ge0/2
  ip address 10.5.1.1/24
  dhcp-server
   address-pool 10.5.1.0/24
   exclude 10.5.1.1-10.5.1.99 10.5.1.200-10.5.1.254
   lease-time 86400
   admin-state up
   options
    default-gateway 10.5.1.1
    dns-servers 10.1.90.10
   exit
  exit
  no shutdown
 exit
exit
vpn 512
 interface eth0
  ip dhcp-client
  no shutdown
 exit
exit
omp
 no shutdown
 advertise connected
exit
commit
