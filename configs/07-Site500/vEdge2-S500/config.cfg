system
 host-name               vEdge2-S500
 system-ip               10.200.50.2
 site-id                 500
 admin-tech-on-failure
 no route-consistency-check
 no vrrp-advt-with-phymac
 organization-name       site-900
 vbond 10.9.0.12
 aaa
  auth-order      local radius tacacs
  usergroup basic
   task system read
   task interface read
  !
  usergroup netadmin
  !
  usergroup operator
   task system read
   task interface read
   task policy read
   task routing read
   task security read
  !
  usergroup tenantadmin
  !
  user admin
   ! password <hash SHA-512 luu cuc bo - KHONG commit>
  !
  ciscotacro-user true
  ciscotacrw-user true
 !
 logging
  disk
   enable
  !
 !
 ntp
  parent
   no enable
   stratum 5
  exit
 !
 support
  zbfw-tcp-finwait-time 30
  zbfw-tcp-idle-time    3600
  zbfw-tcp-synwait-time 30
  zbfw-udp-idle-time    30
 !
!
omp
 no shutdown
 graceful-restart
 advertise connected
 advertise static
!
security
 ipsec
  integrity-type ip-udp-esp esp
 !
!
vpn 0
 router
  bgp 65040
   neighbor 203.0.113.22
    no shutdown
    remote-as 64511
    address-family ipv4-unicast
    !
   !
  !
 !
 interface ge0/0
  ip address 203.0.113.21/30
  ipv6 dhcp-client
  nat
  !
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service all
   no allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service ospf
   no allow-service stun
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 203.0.113.22
!
vpn 1
 name LAN
 interface ge0/1
  ip address 10.5.1.6/30
  no shutdown
 !
 ip route 0.0.0.0/0 vpn 0
 ip route 10.5.0.0/16 10.5.1.5
!
vpn 512
 interface eth0
  ip dhcp-client
  ipv6 dhcp-client
  no shutdown
 !
!
