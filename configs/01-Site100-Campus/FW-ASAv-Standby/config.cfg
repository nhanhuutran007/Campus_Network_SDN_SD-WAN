!
hostname FW-ASAv-Standby
enable password vnpro@2026
username admin password vnpro@2026 privilege 15
!
interface GigabitEthernet0/0
 nameif inside
 security-level 100
 ip address 10.1.2.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside2
 security-level 100
 ip address 10.1.2.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 nameif outside
 security-level 0
 ip address 10.1.3.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 nameif outside2
 security-level 0
 ip address 10.1.3.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 nameif dmz
 security-level 50
 ip address 10.1.1.2 255.255.255.240
 no shutdown
!
interface GigabitEthernet0/5
 description Failover / HA-Sync (LAN-FO 10.1.255.0/29)
 no nameif
 no security-level
 no ip address
!
interface Management0/0
 description ASDM management (VLAN 99 - 10.1.99.34)
 nameif management
 security-level 100
 ip address 10.1.99.34 255.255.255.0
 no shutdown
!
failover
failover lan unit secondary
failover lan interface failover GigabitEthernet0/5
failover interface ip failover 10.1.255.1 255.255.255.248 standby 10.1.255.2
!
http server enable
http 10.1.99.0 255.255.255.0 management
!
logging enable
logging trap informational
logging host inside 10.1.90.11
!
object-group service WEB_SVC tcp
 port-object eq www
 port-object eq https
!
object-group service MAIL_SVC tcp
 port-object eq smtp
 port-object eq 587
 port-object eq imap4
 port-object eq 993
!
access-list SDWAN_IN remark Chi nhanh SD-WAN -> DMZ: chi cho phep dich vu cong khai
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.1.10 object-group WEB_SVC
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.1.11 object-group MAIL_SVC
access-list SDWAN_IN extended permit icmp 10.0.0.0 255.0.0.0 10.1.1.0 255.255.255.240 echo
access-list SDWAN_IN extended deny ip 10.0.0.0 255.0.0.0 10.1.1.0 255.255.255.240 log
access-list SDWAN_IN remark Chi nhanh SD-WAN -> DNS noi bo va mang campus
access-list SDWAN_IN extended permit udp 10.0.0.0 255.0.0.0 host 10.1.90.10 eq domain
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.90.10 eq domain
access-list SDWAN_IN extended permit ip 10.0.0.0 255.0.0.0 10.1.0.0 255.255.0.0
access-list INSIDE_OUT remark Chi DNS server 10.1.90.10 hoi DNS ra Internet; may khac chan DNS ra ngoai 10/8 (ASAv 100 conn)
access-list INSIDE_OUT extended permit udp any 10.0.0.0 255.0.0.0 eq domain
access-list INSIDE_OUT extended permit tcp any 10.0.0.0 255.0.0.0 eq domain
access-list INSIDE_OUT extended permit udp host 10.1.90.10 any eq domain
access-list INSIDE_OUT extended permit tcp host 10.1.90.10 any eq domain
access-list INSIDE_OUT extended deny udp any any eq domain
access-list INSIDE_OUT extended deny tcp any any eq domain
access-list INSIDE_OUT remark VLAN 99 quan tri va Server Farm khong ra Internet tu do (giai doan 5)
access-list INSIDE_OUT extended permit ip 10.1.99.0 255.255.255.0 10.0.0.0 255.0.0.0
access-list INSIDE_OUT extended deny ip 10.1.99.0 255.255.255.0 any log warnings
access-list INSIDE_OUT extended permit ip 10.1.90.0 255.255.255.0 10.0.0.0 255.0.0.0
access-list INSIDE_OUT extended permit tcp 10.1.90.0 255.255.255.0 any eq www
access-list INSIDE_OUT extended permit tcp 10.1.90.0 255.255.255.0 any eq https
access-list INSIDE_OUT extended permit udp 10.1.90.0 255.255.255.0 any eq ntp
access-list INSIDE_OUT extended deny ip 10.1.90.0 255.255.255.0 any log warnings
access-list INSIDE_OUT extended permit ip any any
access-group INSIDE_OUT in interface inside
access-group INSIDE_OUT in interface inside2
access-group SDWAN_IN in interface outside
access-group SDWAN_IN in interface outside2
access-list DMZ_IN remark DMZ -> noi bo: chi Syslog, DNS va ping
access-list DMZ_IN extended permit udp 10.1.1.0 255.255.255.240 host 10.1.90.11 eq syslog
access-list DMZ_IN extended permit udp 10.1.1.0 255.255.255.240 host 10.1.90.10 eq domain
access-list DMZ_IN extended permit tcp 10.1.1.0 255.255.255.240 host 10.1.90.10 eq domain
access-list DMZ_IN extended permit icmp 10.1.1.0 255.255.255.240 10.0.0.0 255.0.0.0 echo
access-list DMZ_IN extended deny ip 10.1.1.0 255.255.255.240 10.0.0.0 255.0.0.0 log
access-list DMZ_IN remark DMZ -> Internet: chi HTTP/HTTPS/NTP (giai doan 5)
access-list DMZ_IN extended permit tcp 10.1.1.0 255.255.255.240 any eq www
access-list DMZ_IN extended permit tcp 10.1.1.0 255.255.255.240 any eq https
access-list DMZ_IN extended permit udp 10.1.1.0 255.255.255.240 any eq ntp
access-list DMZ_IN extended deny ip 10.1.1.0 255.255.255.240 any log warnings
access-group DMZ_IN in interface dmz
route outside 0.0.0.0 0.0.0.0 10.1.3.10 1
route outside2 0.0.0.0 0.0.0.0 10.1.3.14 2
!
router ospf 1
 network 10.1.2.8 255.255.255.252 area 0
 network 10.1.2.12 255.255.255.252 area 0
 network 10.1.1.0 255.255.255.240 area 0
 default-information originate always
!
class-map DNS_CONN
 match port udp eq domain
!
policy-map global_policy
 class inspection_default
  inspect icmp
 class DNS_CONN
  set connection timeout idle 0:00:10
!
