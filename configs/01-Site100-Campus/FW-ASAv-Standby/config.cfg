!
hostname FW-ASAv-Standby
!
interface GigabitEthernet0/0
 nameif inside
 security-level 100
 ip address 10.1.2.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside2
 security-level 100
 ip address 10.1.2.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 nameif outside
 security-level 0
 ip address 10.1.3.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 nameif outside2
 security-level 0
 ip address 10.1.3.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 nameif dmz
 security-level 50
 ip address 10.1.1.2 255.255.255.240
 no shutdown
!
interface GigabitEthernet0/5
 description Failover / HA-Sync (LAN-FO 10.1.255.0/29)
 no nameif
 no security-level
 no ip address
!
failover
failover lan unit secondary
failover lan interface failover GigabitEthernet0/5
failover interface ip failover 10.1.255.2 255.255.255.248 standby 10.1.255.1
!
route outside 0.0.0.0 0.0.0.0 10.1.3.10 1
route outside2 0.0.0.0 0.0.0.0 10.1.3.14 2
!
router ospf 1
 network 10.1.2.8 255.255.255.252 area 0
 network 10.1.2.12 255.255.255.252 area 0
 network 10.1.1.0 255.255.255.240 area 0
 default-information originate always
!
