!
! SW-WAN-Edge2 (Site 100) - switch outside giua cap FW-ASAv HA va vEdge2-S100 ge0/1 (VPN 1).
! Hai unit ASA phai chung mot doan L2 voi router WAN de failover giu nguyen IP.
! Moi duong WAN mot switch rieng -> hong 1 switch thi FW chuyen sang duong con lai (SLA track).
!   VLAN 104 FW-OUTSIDE2 10.1.3.8/29 : FW .9 (standby .12), vEdge2 ge0/1 .10
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-WAN-Edge2
!
no aaa new-model
clock timezone EET 2 0
!
no ip domain-lookup
!
vtp mode off
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 104
 name FW-OUTSIDE2
!
interface Ethernet0/0
 description To FW-ASAv-Active Gi0/3 (outside2)
 switchport access vlan 104
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/1
 description To FW-ASAv-Standby Gi0/3 (outside2)
 switchport access vlan 104
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/2
 description To vEdge2-S100 ge0/1 (VPN 1)
 switchport access vlan 104
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/3
 shutdown
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
end
