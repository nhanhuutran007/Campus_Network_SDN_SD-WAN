!
hostname SwitchServerFarm
!
vlan 90
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT
!
vlan 100
 name SDN-MGMT
!
interface Ethernet0/0
 description To Core-SW1 Gi1/1
 switchport trunk allowed vlan 90,99,100
 switchport mode trunk
!
interface Ethernet0/1
 description To DHCP-Server (10.1.90.10)
 switchport access vlan 90
 switchport mode access
!
interface Ethernet0/2
 description To Syslog-Server (10.1.90.11)
 switchport access vlan 90
 switchport mode access
!
interface Ethernet0/3
 description To Core-SW2 Gi1/1
 switchport trunk allowed vlan 90,99,100
 switchport mode trunk
!
interface Ethernet1/0
 description To SDN_CONTROLLER e0 + AccessTest e1 (10.1.100.0/24)
 switchport access vlan 100
 switchport mode access
!
interface Vlan99
 description MANAGEMENT
 ip address 10.1.99.32 255.255.255.0
!
end
