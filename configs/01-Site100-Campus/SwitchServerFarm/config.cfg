!
hostname SwitchServerFarm
!
vlan 90
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT
!
interface Ethernet0/0
 description To Core-SW1 Gi1/1 (trunk 90,99-mgmt)
 switchport trunk allowed vlan 90,99
 switchport mode trunk
!
interface Ethernet0/2
 description To Syslog-Server (10.1.90.11)
 switchport access vlan 90
 switchport mode access
!
interface Ethernet0/3
 description To Core-SW2 Gi1/1 (trunk 90,99-mgmt)
 switchport trunk allowed vlan 90,99
 switchport mode trunk
!
interface Ethernet1/0
 description To SDN_CONTROLLER e0 (mgmt SDN, VLAN 99 - 10.1.99.10)
 switchport access vlan 99
 switchport mode access
!
interface Ethernet1/1
 description To DHCP-Server (10.1.90.10)
 switchport access vlan 90
 switchport mode access
!
interface Ethernet1/2
 description To FW-ASAv-Active Management0/0 (ASDM 10.1.99.33)
 switchport access vlan 99
 switchport mode access
!
interface Ethernet1/3
 description To FW-ASAv-Standby Management0/0 (ASDM 10.1.99.34)
 switchport access vlan 99
 switchport mode access
!
interface Ethernet2/0
 description To PC-Management (ASDM 10.1.99.50)
 switchport access vlan 99
 switchport mode access
!
interface Vlan99
 description MANAGEMENT
 ip address 10.1.99.32 255.255.255.0
!
end
