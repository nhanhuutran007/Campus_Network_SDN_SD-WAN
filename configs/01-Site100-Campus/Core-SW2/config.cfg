!config.cfg
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Core-SW2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
vtp mode off
!
vlan 10
 name CNTT
!
vlan 20
 name TTK
!
vlan 30
 name LUAT
!
vlan 40
 name HANHCHINH
!
vlan 90
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT
!
ip routing
!
spanning-tree mode rapid-pvst
!
interface Ethernet0/0
 description EtherChannel to Core-SW1 E0/0
 no switchport
 channel-group 10 mode active
!
interface Ethernet0/1
 description EtherChannel to Core-SW1 E0/1
 no switchport
 channel-group 10 mode active
!
interface Port-channel10
 description Po10 - Core-SW2 <-> Core-SW1 (10.1.0.4/30)
 no switchport
 ip address 10.1.0.6 255.255.255.252
!
interface Ethernet0/2
 description To Dist-SW2 e6
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,90,99
!
interface Ethernet0/3
 description To FW-ASAv-Active Gi0/1 (10.1.2.4/30)
 no switchport
 ip address 10.1.2.6 255.255.255.252
!
interface Ethernet1/0
 description To FW-ASAv-Standby Gi0/0 (10.1.2.8/30)
 no switchport
 ip address 10.1.2.10 255.255.255.252
!
interface Ethernet1/1
 description To SwitchServerFarm e0/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 90,99
!
interface Ethernet1/2
 description To Dist-SW1 e7
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,90,99
!
!
interface Vlan10
 description CNTT - VRRP VIP 10.1.10.1 (Standby)
 ip address 10.1.10.3 255.255.255.0
 vrrp 10 ip 10.1.10.1
 vrrp 10 priority 100
 ip helper-address 10.1.90.10
!
interface Vlan20
 description TTK - VRRP VIP 10.1.20.1 (Standby)
 ip address 10.1.20.3 255.255.255.0
 vrrp 20 ip 10.1.20.1
 vrrp 20 priority 100
 ip helper-address 10.1.90.10
!
interface Vlan30
 description LUAT - VRRP VIP 10.1.30.1 (Standby)
 ip address 10.1.30.3 255.255.255.0
 vrrp 30 ip 10.1.30.1
 vrrp 30 priority 100
 ip helper-address 10.1.90.10
!
interface Vlan40
 description HANHCHINH - VRRP VIP 10.1.40.1 (Standby)
 ip address 10.1.40.3 255.255.255.0
 vrrp 40 ip 10.1.40.1
 vrrp 40 priority 100
 ip helper-address 10.1.90.10
!
interface Vlan90
 description SERVER-FARM - VRRP VIP 10.1.90.1 (Standby)
 ip address 10.1.90.3 255.255.255.0
 vrrp 90 ip 10.1.90.1
 vrrp 90 priority 100
!
interface Vlan99
 description MANAGEMENT
 ip address 10.1.99.2 255.255.255.0
!
router ospf 1
 router-id 10.1.0.2
 network 10.1.0.4 0.0.0.3 area 0
 network 10.1.2.4 0.0.0.3 area 0
 network 10.1.2.8 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.90.0 0.0.0.255 area 0
!
line con 0
 logging synchronous
!
end