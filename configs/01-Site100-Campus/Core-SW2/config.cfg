!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname Core-SW2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
vtp mode off
!
!
!
ip domain-name campus.internal
ip cef
no ipv6 cef
!
!
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 99 priority 12288
!
!
vlan 10
 name CNTT
!
vlan 20
 name TTK
!
vlan 30
 name LUAT
!
vlan 40
 name HANHCHINH
!
vlan 90
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT
!
vlan 100
 name CORE-TRANSIT
!
vlan 101
 name FW-INSIDE
!
vlan 102
 name FW-INSIDE2
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Port-channel10
 description Trunk to Core-SW1 (VLAN 100 core transit, 101/102 FW transit)
 switchport trunk allowed vlan 10,20,30,40,100-102
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/0
 description EtherChannel to Core-SW1 E0/0
 switchport trunk allowed vlan 10,20,30,40,100-102
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 10 mode active
!
interface Ethernet0/1
 description EtherChannel to Core-SW1 E0/1
 switchport trunk allowed vlan 10,20,30,40,100-102
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 10 mode active
!
interface Ethernet0/2
 description To Dist-SW2 e6
 switchport trunk allowed vlan 10,20,30,40
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/3
 description To FW-ASAv-Active Gi0/1 (VLAN 102 FW-INSIDE2)
 switchport access vlan 102
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet1/0
 description To FW-ASAv-Standby Gi0/0 (VLAN 101 FW-INSIDE)
 switchport access vlan 101
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet1/1
 description To SwitchServerFarm e0/3
 switchport trunk allowed vlan 90
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet1/2
 description To Dist-SW1 e7
 switchport trunk allowed vlan 10,20,30,40,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet1/3
!
interface Vlan10
 description CNTT - VRRP VIP 10.1.10.1 (Standby)
 ip address 10.1.10.3 255.255.255.0
 ip helper-address 10.1.90.10
 ip ospf cost 10
 vrrp 10 ip 10.1.10.1
!
interface Vlan20
 description TTK - VRRP VIP 10.1.20.1 (Standby)
 ip address 10.1.20.3 255.255.255.0
 ip helper-address 10.1.90.10
 ip ospf cost 10
 vrrp 20 ip 10.1.20.1
!
interface Vlan30
 description LUAT - VRRP VIP 10.1.30.1 (Standby)
 ip address 10.1.30.3 255.255.255.0
 ip helper-address 10.1.90.10
 ip ospf cost 10
 vrrp 30 ip 10.1.30.1
!
interface Vlan40
 description HANHCHINH - VRRP VIP 10.1.40.1 (Standby)
 ip address 10.1.40.3 255.255.255.0
 ip helper-address 10.1.90.10
 ip ospf cost 10
 vrrp 40 ip 10.1.40.1
!
interface Vlan90
 description SERVER-FARM - VRRP VIP 10.1.90.1 (Standby)
 ip address 10.1.90.3 255.255.255.0
 ip ospf cost 10
 vrrp 90 ip 10.1.90.1
!
interface Vlan99
 description MANAGEMENT - TAT 04/10/2026: VLAN 99 cua Core-SW2 la ocdao (OVS khong noi 99 toi Core-SW2)
 ip address 10.1.99.2 255.255.255.0
 shutdown
!
interface Vlan100
 description CORE-TRANSIT to Core-SW1
 ip address 10.1.0.6 255.255.255.252
!
interface Vlan101
 description FW-INSIDE 10.1.2.0/29 (FW .1, standby .4, Core-SW1 .2)
 ip address 10.1.2.3 255.255.255.248
!
interface Vlan102
 description FW-INSIDE2 10.1.2.8/29 (FW .9, standby .12, Core-SW1 .11)
 ip address 10.1.2.10 255.255.255.248
 ip ospf cost 20
!
router ospf 1
 router-id 10.1.0.2
 network 10.1.0.4 0.0.0.3 area 0
 network 10.1.2.0 0.0.0.7 area 0
 network 10.1.2.8 0.0.0.7 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.90.0 0.0.0.255 area 0
!
! username netops privilege 15 secret <xem file credentials cuc bo - dong 'netops (SSH Site 100)'>
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip route 10.1.99.0 255.255.255.0 10.1.0.5 name MGMT-qua-Core-SW1
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list standard NETOPS_MGMT
 permit 10.1.99.50
 remark NetOps-Server (DHCP-Server 72) va PC-Management
 permit 10.1.90.10
 deny   any log
!
!
logging host 10.1.90.11
access-list 98 remark SNMP RO chi cho SDN controller (Campus SDN Console)
access-list 98 permit 10.1.99.10
!
!
! snmp-server community <community> RO 98
!   (community luu o file credentials cuc bo - KHONG commit)
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class NETOPS_MGMT in
 login local
 transport input ssh
!
!
!
end
