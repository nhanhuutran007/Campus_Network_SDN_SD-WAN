# Nginx - cổng thông tin nội bộ www.campus.internal (Web-Server node 22, DMZ 10.1.1.10)
# HTTP chỉ chuyển hướng sang HTTPS; log gửi về Syslog-Server 10.1.90.11.

server {
    listen 80 default_server;
    server_name www.campus.internal web-server 10.1.1.10;
    access_log syslog:server=10.1.90.11:514,facility=local7,tag=nginx combined;
    location = /whoami { default_type text/plain; return 200 "client=$remote_addr\n"; }
    # Kho script/bộ cài nội bộ cho máy Windows (PowerShell 4 trên 2012 R2 không tin chứng chỉ tự ký)
    location /setup/ { alias /var/www/setup/; autoindex on; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name www.campus.internal web-server 10.1.1.10;

    ssl_certificate     /etc/ssl/campus/www.campus.internal.crt;
    ssl_certificate_key /etc/ssl/campus/www.campus.internal.key;
    ssl_protocols       TLSv1.2;

    root  /var/www/campus;
    index index.html;

    access_log /var/log/nginx/campus-access.log combined;
    access_log syslog:server=10.1.90.11:514,facility=local7,tag=nginx combined;
    error_log  syslog:server=10.1.90.11:514,facility=local7,tag=nginx warn;

    # Trả về IP nguồn thực của người dùng (chi nhánh không NAT qua SD-WAN)
    location = /whoami {
        default_type text/plain;
        return 200 "client=$remote_addr\nserver=$server_addr\nhost=$host\n";
    }

    location / { try_files $uri $uri/ =404; }
}
