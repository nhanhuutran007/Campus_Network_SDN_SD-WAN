 system
 host-name               vEdge1-S100
 system-ip               10.200.100.1
 site-id                 100
 admin-tech-on-failure
 no route-consistency-check
 no vrrp-advt-with-phymac
 organization-name       site-900
 vbond 10.9.0.12
 aaa
  auth-order      local radius tacacs
  usergroup basic
   task system read
   task interface read
  !
  usergroup netadmin
  !
  usergroup operator
   task system read
   task interface read
   task policy read
   task routing read
   task security read
  !
  usergroup tenantadmin
  !
  user admin
   password $6$ce584d655579f0fb$ZNEZ4lyF5.yVFirbpo9rhhoPP97IhYutR2U56niyZqG7.cXyyJ12OPZVMDs41z7PQg5vyz3pfrPahkiEmMpH2.
  !
  ciscotacro-user true
  ciscotacrw-user true
 !
 logging
  disk
   enable
  !
 !
 ntp
  parent
   no enable
   stratum 5
  exit
 !
 support
  zbfw-tcp-finwait-time 30
  zbfw-tcp-idle-time    3600
  zbfw-tcp-synwait-time 30
  zbfw-udp-idle-time    30
 !
!
bfd app-route poll-interval 120000
omp
 no shutdown
 graceful-restart
 advertise connected
 advertise static
!
security
 ipsec
  integrity-type ip-udp-esp esp
 !
!
vpn 0
 router
  bgp 65000
   neighbor 100.64.100.2
    no shutdown
    remote-as 64512
    address-family ipv4-unicast
    !
   !
   neighbor 203.0.113.2
    no shutdown
    remote-as 64511
    address-family ipv4-unicast
    !
   !
  !
 !
 interface ge0/2
  ip address 100.64.100.1/30
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   no allow-service ospf
   allow-service stun
   allow-service https
  !
  no shutdown
 !
 interface ge0/3
  ip address 203.0.113.1/30
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   no allow-service ospf
   allow-service stun
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 100.64.100.2
 ip route 0.0.0.0/0 203.0.113.2
 ip route 10.9.0.0/16 203.0.113.2
 ip route 10.9.0.0/24 100.64.100.2
 ip route 10.9.0.0/24 203.0.113.2
!
vpn 1
 name LAN
 interface ge0/0
  ip address 10.1.3.2/30
  no shutdown
 !
 interface ge0/1
  ip address 10.1.3.14/30
  no shutdown
 !
 interface loopback0
  ip address 10.1.255.1/32
  no shutdown
 !
 ip route 10.1.0.0/16 10.1.3.1
!
vpn 512
 interface eth0
  ip dhcp-client
  ipv6 dhcp-client
  no shutdown
 !
!
