system
 host-name vEdge1-S100
 system-ip 10.200.100.1
 site-id 100
 organization-name site-900
 vbond 10.9.0.12
 admin-tech-on-failure
!
bfd
 app-route
  poll-interval 120000
 !
!
vpn 0
 interface ge0/2
  ip address 100.64.100.1/30
  no shutdown
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   allow-service stun
   allow-service https
  !
 !
 interface ge0/3
  ip address 203.0.113.1/30
  no shutdown
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   allow-service stun
   allow-service https
  !
 !
 router bgp 65000
  neighbor 100.64.100.2 remote-as 64512
  neighbor 100.64.100.2 address-family ipv4-unicast
  neighbor 203.0.113.2 remote-as 64511
  neighbor 203.0.113.2 address-family ipv4-unicast
 !
 ip route 10.9.0.0/16 203.0.113.2
 ip route 10.9.0.0/24 100.64.100.2
 ip route 10.9.0.0/24 203.0.113.2
 ip route 0.0.0.0/0 100.64.100.2
 ip route 0.0.0.0/0 203.0.113.2
!
vpn 1
 name LAN
 interface ge0/0
  ip address 10.1.3.2/30
  no shutdown
 !
 interface ge0/1
  ip address 10.1.3.14/30
  no shutdown
 !
 ip route 10.1.0.0/16 10.1.3.1
!
vpn 512
 interface eth0
  ip dhcp-client
  no shutdown
 !
!
omp
 no shutdown
 graceful-restart
 advertise connected
 advertise static
!