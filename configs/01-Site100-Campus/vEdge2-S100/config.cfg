system
 host-name vEdge2-S100
 system-ip 10.200.100.2
 site-id 100
 organization-name site-900
 vbond 10.9.0.12
 admin-tech-on-failure
!
vpn 0
 interface ge0/2
  ip address 203.0.113.5/30
  no shutdown
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   allow-service stun
   allow-service https
  !
 !
 interface ge0/3
  ip address 100.64.100.5/30
  no shutdown
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service bgp
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service sshd
   allow-service netconf
   allow-service ntp
   allow-service stun
   allow-service https
  !
 !
 router bgp 65000
  neighbor 203.0.113.6 remote-as 64511
  neighbor 203.0.113.6 address-family ipv4-unicast
  neighbor 100.64.100.6 remote-as 64512
  neighbor 100.64.100.6 address-family ipv4-unicast
 !
 ip route 10.9.0.0/16 203.0.113.6
 ip route 10.9.0.0/24 100.64.100.6
!
vpn 512
 interface ge0/0
  ip address 10.1.3.10/30
  no shutdown
 !
 interface ge0/1
  ip address 10.1.3.6/30
  no shutdown
 !
 ip route 0.0.0.0/0 10.1.3.9
!
omp
 no shutdown
!