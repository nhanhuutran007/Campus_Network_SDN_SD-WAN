!config.cfg
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Core-SW1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
vlan 10
 name CNTT
!
vlan 20
 name TTK
!
vlan 30
 name LUAT
!
vlan 40
 name HANHCHINH
!
vlan 90
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/0
 description EtherChannel to Core-SW2 Gi0/0
 no switchport
 channel-group 10 mode active
!
interface GigabitEthernet0/1
 description EtherChannel to Core-SW2 Gi0/1
 no switchport
 channel-group 10 mode active
!
interface Port-channel10
 description Po10 - Core-SW1 <-> Core-SW2 (10.1.0.4/30)
 no switchport
 ip address 10.1.0.5 255.255.255.252
!
interface GigabitEthernet0/2
 description To Dist-SW1 e6
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,90,99
!
interface GigabitEthernet0/3
 description To FW-ASAv-Standby Gi0/1 (10.1.2.12/30)
 no switchport
 ip address 10.1.2.14 255.255.255.252
!
interface GigabitEthernet1/0
 description To FW-ASAv-Active Gi0/0 (10.1.2.0/30)
 no switchport
 ip address 10.1.2.2 255.255.255.252
!
interface GigabitEthernet1/1
 description To SwitchServerFarm e0/0
 switchport mode trunk
 switchport trunk allowed vlan 90,99
!
interface GigabitEthernet1/2
 description To Dist-SW2 e7
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,90,99
!
interface Vlan10
 description CNTT - VRRP VIP 10.1.10.1
 ip address 10.1.10.2 255.255.255.0
 vrrp 10 ip 10.1.10.1
 vrrp 10 priority 150
 vrrp 10 preempt
 ip helper-address 10.1.90.10
!
interface Vlan20
 description TTK - VRRP VIP 10.1.20.1
 ip address 10.1.20.2 255.255.255.0
 vrrp 20 ip 10.1.20.1
 vrrp 20 priority 150
 vrrp 20 preempt
 ip helper-address 10.1.90.10
!
interface Vlan30
 description LUAT - VRRP VIP 10.1.30.1
 ip address 10.1.30.2 255.255.255.0
 vrrp 30 ip 10.1.30.1
 vrrp 30 priority 150
 vrrp 30 preempt
 ip helper-address 10.1.90.10
!
interface Vlan40
 description HANHCHINH - VRRP VIP 10.1.40.1
 ip address 10.1.40.2 255.255.255.0
 vrrp 40 ip 10.1.40.1
 vrrp 40 priority 150
 vrrp 40 preempt
 ip helper-address 10.1.90.10
!
interface Vlan90
 description SERVER-FARM - VRRP VIP 10.1.90.1
 ip address 10.1.90.2 255.255.255.0
 vrrp 90 ip 10.1.90.1
 vrrp 90 priority 150
 vrrp 90 preempt
!
interface Vlan99
 description MANAGEMENT
 ip address 10.1.99.1 255.255.255.0
!
router ospf 1
 router-id 10.1.0.1
 network 10.1.0.4 0.0.0.3 area 0
 network 10.1.2.0 0.0.0.3 area 0
 network 10.1.2.12 0.0.0.3 area 0
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.20.0 0.0.0.255 area 0
 network 10.1.30.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.90.0 0.0.0.255 area 0
!
line con 0
 logging synchronous
!
end
