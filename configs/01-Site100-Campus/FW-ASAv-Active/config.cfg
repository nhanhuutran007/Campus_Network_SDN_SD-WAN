!
hostname FW-ASAv-Active
enable password vnpro@2026
username admin password vnpro@2026 privilege 15
!
interface GigabitEthernet0/0
 nameif inside
 security-level 100
 ip address 10.1.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside2
 security-level 100
 ip address 10.1.2.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 nameif outside
 security-level 0
 ip address 10.1.3.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 nameif outside2
 security-level 0
 ip address 10.1.3.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 nameif dmz
 security-level 50
 ip address 10.1.1.1 255.255.255.240
 no shutdown
!
interface GigabitEthernet0/5
 description Failover / HA-Sync (LAN-FO 10.1.255.0/29)
 no nameif
 no security-level
 no ip address
!
interface Management0/0
 description ASDM management (VLAN 99 - 10.1.99.33)
 nameif management
 security-level 100
 ip address 10.1.99.33 255.255.255.0
 no shutdown
!
failover
failover lan unit primary
failover lan interface failover GigabitEthernet0/5
failover interface ip failover 10.1.255.1 255.255.255.248 standby 10.1.255.2
failover management-interface management Management0/0
failover interface ip management 10.1.99.33 255.255.255.0 standby 10.1.99.34
!
http server enable
http 10.1.99.0 255.255.255.0 management
!
logging enable
logging trap informational
logging host inside 10.1.90.11
!
object-group service WEB_SVC tcp
 port-object eq www
 port-object eq https
!
object-group service MAIL_SVC tcp
 port-object eq smtp
 port-object eq 587
 port-object eq imap4
 port-object eq 993
!
access-list SDWAN_IN remark Chi nhanh SD-WAN -> DMZ: chi cho phep dich vu cong khai
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.1.10 object-group WEB_SVC
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.1.11 object-group MAIL_SVC
access-list SDWAN_IN extended permit icmp 10.0.0.0 255.0.0.0 10.1.1.0 255.255.255.240 echo
access-list SDWAN_IN extended deny ip 10.0.0.0 255.0.0.0 10.1.1.0 255.255.255.240 log
access-list SDWAN_IN remark Chi nhanh SD-WAN -> DNS noi bo va mang campus
access-list SDWAN_IN extended permit udp 10.0.0.0 255.0.0.0 host 10.1.90.10 eq domain
access-list SDWAN_IN extended permit tcp 10.0.0.0 255.0.0.0 host 10.1.90.10 eq domain
access-list SDWAN_IN extended permit ip 10.0.0.0 255.0.0.0 10.1.0.0 255.255.0.0
access-group SDWAN_IN in interface outside
access-group SDWAN_IN in interface outside2
access-list DMZ_IN remark DMZ -> noi bo: chi Syslog, DNS va ping
access-list DMZ_IN extended permit udp 10.1.1.0 255.255.255.240 host 10.1.90.11 eq syslog
access-list DMZ_IN extended permit udp 10.1.1.0 255.255.255.240 host 10.1.90.10 eq domain
access-list DMZ_IN extended permit tcp 10.1.1.0 255.255.255.240 host 10.1.90.10 eq domain
access-list DMZ_IN extended permit icmp 10.1.1.0 255.255.255.240 10.0.0.0 255.0.0.0 echo
access-list DMZ_IN extended deny ip 10.1.1.0 255.255.255.240 10.0.0.0 255.0.0.0 log
access-list DMZ_IN extended permit ip 10.1.1.0 255.255.255.240 any
access-group DMZ_IN in interface dmz
route outside 0.0.0.0 0.0.0.0 10.1.3.2 1
route outside2 0.0.0.0 0.0.0.0 10.1.3.6 2
!
router ospf 1
 network 10.1.2.0 255.255.255.252 area 0
 network 10.1.2.4 255.255.255.252 area 0
 network 10.1.1.0 255.255.255.240 area 0
 default-information originate always
!
policy-map global_policy
 class inspection_default
  inspect icmp
!
