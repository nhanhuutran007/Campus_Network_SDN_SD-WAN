!
! SW-WAN-Edge1 (Site 100) - switch outside giua cap FW-ASAv HA va vEdge1-S100 ge0/0 (VPN 1).
! Hai unit ASA phai chung mot doan L2 voi router WAN de failover giu nguyen IP.
! Moi duong WAN mot switch rieng -> hong 1 switch thi FW chuyen sang duong con lai (SLA track).
!   VLAN 103 FW-OUTSIDE 10.1.3.0/29 : FW .1 (standby .4), vEdge1 ge0/0 .2
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-WAN-Edge1
!
no aaa new-model
clock timezone EET 2 0
!
no ip domain-lookup
!
vtp mode off
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 103
 name FW-OUTSIDE
!
interface Ethernet0/0
 description To FW-ASAv-Active Gi0/2 (outside)
 switchport access vlan 103
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/1
 description To FW-ASAv-Standby Gi0/2 (outside)
 switchport access vlan 103
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/2
 description To vEdge1-S100 ge0/0 (VPN 1)
 switchport access vlan 103
 switchport mode access
 spanning-tree portfast edge
!
interface Ethernet0/3
 shutdown
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
end
