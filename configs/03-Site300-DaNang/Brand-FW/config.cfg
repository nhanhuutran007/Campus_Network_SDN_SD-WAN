!
hostname Brand-FW-S300
!
interface GigabitEthernet0/0
 nameif outside2
 security-level 0
 ip address 10.3.1.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif outside1
 security-level 0
 ip address 10.3.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 no shutdown
!
interface GigabitEthernet0/2.80
 vlan 80
 nameif vlan80
 security-level 100
 ip address 10.3.80.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2.90
 vlan 90
 nameif vlan90
 security-level 100
 ip address 10.3.90.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2.99
 vlan 99
 nameif vlan99
 security-level 100
 ip address 10.3.99.1 255.255.255.0
 no shutdown
!
route outside1 0.0.0.0 0.0.0.0 10.3.1.2 1
route outside2 0.0.0.0 0.0.0.0 10.3.1.6 2
!
dhcpd address 10.3.80.100-10.3.80.199 vlan80
dhcpd enable vlan80
dhcpd address 10.3.90.100-10.3.90.199 vlan90
dhcpd enable vlan90
!
