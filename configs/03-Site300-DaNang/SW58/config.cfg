!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname SW58
!
vlan 80
 name DU-LICH
!
vlan 99
 name MANAGEMENT
!
boot-start-marker
boot-end-marker
!
!
!
! username netops privilege 15 secret <xem file credentials cuc bo - dong 'netops (SSH Site 100)'>
no aaa new-model
clock timezone EET 2 0
!
!
!
!
!
!
!
!
ip domain-name campus.internal
ip cef
no ipv6 cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description To SwitchBrand-S300 e0/1
 switchport trunk allowed vlan 80,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/1
 description To VPC50 (PC DL-1 - 10.3.80.10)
 switchport access vlan 80
 switchport mode access
!
interface Ethernet0/2
 description To VPC54 (PC DL-2 - 10.3.80.11)
 switchport access vlan 80
 switchport mode access
!
interface Ethernet0/3
!
interface Vlan99
 ip address 10.3.99.11 255.255.255.0
!
ip forward-protocol nd
!
ip http server
ip http secure-server
!
ip route 0.0.0.0 0.0.0.0 10.3.99.1
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list standard NETOPS_MGMT
 permit 10.1.99.50
 permit 10.1.90.10
 deny   any log
!
!
!
!
!
control-plane
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class NETOPS_MGMT in
 login local
 transport input ssh
!
!
!
end
